{% extends "core/base.html" %}
{% block title %}Новый пароль{% endblock %}
{% block content %}
<h1>Новый пароль</h1>
{% if validlink %}
<form method="post" action="">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">Установить пароль</button>
</form>
{% else %}
<p>Ссылка для сброса пароля недействительна или истекла.</p>
<p><a href="{% url 'password_reset' %}">Запросить новую ссылку</a></p>
{% endif %}
{% endblock %}
