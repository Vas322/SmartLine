{% extends "core/base.html" %}
{% block title %}Редактирование игрока{% endblock %}
{% block content %}
<div class="page-head"><h1>Редактирование игрока: {{ player.nickname }}</h1></div>
<div class="card">
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">Сохранить</button>
    <a href="{% url 'players' %}" class="btn btn-secondary">Отмена</a>
</form>
</div>
{% endblock %}
