services:
  smartline-db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartline}
      POSTGRES_USER: ${POSTGRES_USER:-smartline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - smartline_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smartline_net
    restart: unless-stopped

  smartline-web:
    build: .
    env_file: .env
    command: sh -c "python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2"
    depends_on:
      smartline-db:
        condition: service_healthy
    networks:
      - smartline_net
      - caddy_net
    volumes:
      - ./.git:/app/.git:ro
    restart: unless-stopped

  smartline-bot:
    build: .
    env_file: .env
    command: python manage.py poll
    depends_on:
      smartline-db:
        condition: service_healthy
    networks:
      - smartline_net
    restart: unless-stopped

  smartline-backup:
    image: postgres:16
    env_file: .env
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGUSER: ${POSTGRES_USER:-smartline}
      PGHOST: ${POSTGRES_HOST:-smartline-db}
      PGDATABASE: ${POSTGRES_DB:-smartline}
    networks:
      - smartline_net
    profiles: ["tools"]

networks:
  smartline_net:
  caddy_net:
    external: true
    name: app_default

volumes:
  smartline_db_data:
